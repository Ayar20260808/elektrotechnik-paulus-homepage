<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ihr Auftrag | Elektrotechnik Paulus</title>

<!-- WICHTIG: Diese Seite darf nie in einer Suchmaschine landen. Die Links
     enthalten das Geheimnis des Kunden; ein eingesammelter Link waere ein
     offener Zugang. noindex verbietet die Aufnahme, nofollow das Verfolgen,
     noarchive den Zwischenspeicher. -->
<meta name="robots" content="noindex, nofollow, noarchive">

<!-- Der Token steht in der Adresszeile. Ohne diese Zeile wuerde er beim
     Klick auf einen Link nach draussen an die Zielseite mitgeschickt. -->
<meta name="referrer" content="no-referrer">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="bildmarke-farbe.svg" type="image/svg+xml">
<meta name="theme-color" content="#232F3B">
<link rel="stylesheet" href="marke.css">
<style>
  :root{
    --ink:var(--farbe-anthrazit); --dark:var(--farbe-anthrazit); --yellow:var(--farbe-gelb);
    --yellow-text:#8A6B00; --grey-0:var(--farbe-weiss); --grey-100:var(--farbe-grau-hell);
    --grey-300:#DDE0E3; --grey-600:var(--farbe-grau);
    --link-blue:#1F6FB2; --tech-blue:#00A3D9; --green:#4A7C59;
    --font-heading:var(--schrift); --font-body:var(--schrift);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--grey-100);color:var(--ink);font-family:var(--font-body);line-height:1.6;font-size:16px;}
  a{color:var(--link-blue);text-decoration:none;}
  a:hover{color:var(--dark);text-decoration:underline;}
  img{max-width:100%;display:block;}
  h1,h2,h3{font-family:var(--font-heading);color:var(--ink);}
  :focus-visible{outline:2px solid var(--tech-blue);outline-offset:2px;}

  .wrap{max-width:820px;margin:0 auto;padding:0 clamp(16px,5vw,32px);}

  header{background:var(--grey-0);border-bottom:2px solid var(--ink);}
  .kopf-inner{max-width:820px;margin:0 auto;padding:18px clamp(16px,5vw,32px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .kopf-inner .logo img{width:clamp(150px,30vw,200px);height:auto;}
  .kopf-inner .kopf-tel{font-family:var(--font-heading);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;}

  .band{background:var(--dark);color:var(--grey-0);padding:clamp(28px,6vw,44px) 0;}
  .band .augenbraue{color:var(--yellow);font-size:12.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:8px;}
  .band h1{color:var(--grey-0);font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:-.02em;margin:0;}
  .band .nummer{color:#B9C2CB;font-size:15px;margin-top:8px;}

  main{padding:clamp(24px,5vw,40px) 0 60px;}

  .karte{background:var(--grey-0);border:1px solid var(--grey-300);border-radius:10px;
    padding:clamp(20px,4vw,30px);margin-bottom:20px;}
  .karte h2{font-size:17px;font-weight:700;margin-bottom:16px;
    padding-bottom:10px;border-bottom:2px solid var(--grey-300);}

  /* Fortschritt: fuenf Stufen, die erreichten in Gelb. */
  .stufen{display:flex;gap:6px;margin-bottom:14px;}
  .stufe{flex:1;height:8px;border-radius:4px;background:var(--grey-300);}
  .stufe.erreicht{background:var(--yellow);}
  .stufe-text{font-family:var(--font-heading);font-weight:700;font-size:19px;}
  .stufe-zahl{font-size:13.5px;color:var(--grey-600);margin-top:2px;}

  .zeile{display:flex;gap:16px;padding:11px 0;border-top:1px solid var(--grey-300);font-size:15.5px;}
  .zeile:first-of-type{border-top:none;}
  .zeile dt{flex:0 0 130px;color:var(--grey-600);font-size:14px;}
  .zeile dd{flex:1;min-width:0;overflow-wrap:anywhere;}

  .hinweis{background:#FFF7D1;border-left:5px solid var(--yellow);padding:14px 18px;
    border-radius:0 6px 6px 0;margin-bottom:20px;font-size:15.5px;}

  table{width:100%;border-collapse:collapse;font-size:15px;}
  th{text-align:left;font-family:var(--font-heading);font-weight:600;font-size:13px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--grey-600);
    padding:0 10px 9px 0;border-bottom:1px solid var(--grey-300);}
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--grey-300);vertical-align:top;}
  td:last-child,th:last-child{padding-right:0;}
  .geld{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tabelle-rahmen{overflow-x:auto;}

  .marke-pille{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;
    font-weight:600;background:var(--grey-100);color:var(--grey-600);white-space:nowrap;}
  .marke-pille.storniert{background:#FBE3E3;color:#8B2B2B;}

  .leer{color:var(--grey-600);font-size:15px;font-style:italic;}

  /* Ladezustand und Fehlerfall */
  .mitte{text-align:center;padding:60px 0;}
  .mitte h2{font-size:21px;margin-bottom:10px;}
  .mitte p{color:var(--grey-600);max-width:46ch;margin:0 auto 22px;}
  .knopf-reihe{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;
    font-family:var(--font-heading);font-weight:600;font-size:15px;
    border:2px solid transparent;border-radius:6px;cursor:pointer;}
  .btn:hover{text-decoration:none;}
  .btn-gelb{background:var(--yellow);color:var(--dark);border-color:var(--yellow);}
  .btn-gelb:hover{background:var(--farbe-gelb-dunkel);border-color:var(--farbe-gelb-dunkel);}
  .btn-rand{border-color:var(--ink);color:var(--ink);}

  footer{background:var(--grey-0);border-top:2px solid var(--ink);padding:26px 0;}
  .fuss-inner{max-width:820px;margin:0 auto;padding:0 clamp(16px,5vw,32px);
    display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;}
  .fuss-inner address{font-style:normal;color:var(--grey-600);font-size:13.5px;line-height:1.7;}
  .fuss-inner address strong{display:block;color:var(--ink);font-weight:700;font-size:14.5px;}

  @media(max-width:560px){
    .zeile{flex-direction:column;gap:2px;}
    .zeile dt{flex:none;}
  }
</style>
</head>
<body>

<header>
  <div class="kopf-inner">
    <a class="logo" href="https://www.elektrotechnik-paulus.de" aria-label="Elektrotechnik Paulus">
      <img src="logo-quer-farbe.svg" alt="Elektrotechnik Paulus">
    </a>
    <a class="kopf-tel" href="tel:+4922129894083">0221 2989 4083</a>
  </div>
</header>

<div class="band">
  <div class="wrap">
    <div class="augenbraue">Auftragsübersicht</div>
    <h1 id="titel">Ihr Auftrag</h1>
    <div class="nummer" id="kopf-nummer"></div>
  </div>
</div>

<main>
  <div class="wrap">

    <!-- Wird beim Laden gezeigt und danach ausgeblendet. -->
    <div id="laedt" class="mitte">
      <p>Ihr Auftrag wird geladen …</p>
    </div>

    <!-- Fehlerfall: falscher, abgeschalteter oder abgelaufener Link. -->
    <div id="fehler" class="mitte" hidden>
      <h2>Dieser Link lässt sich nicht öffnen</h2>
      <p id="fehler-text"></p>
      <div class="knopf-reihe">
        <a class="btn btn-gelb" href="tel:+4922129894083">0221 2989 4083 anrufen</a>
        <a class="btn btn-rand" href="mailto:info@elektrotechnik-paulus.de">E-Mail schreiben</a>
      </div>
    </div>

    <div id="inhalt" hidden></div>

  </div>
</main>

<footer>
  <div class="fuss-inner">
    <address>
      <strong>Elektrotechnik Paulus GmbH</strong>
      Wartburgstr. 12 · 50733 Köln<br>
      <a href="tel:+4922129894083">0221 2989 4083</a> ·
      <a href="mailto:info@elektrotechnik-paulus.de">info@elektrotechnik-paulus.de</a>
    </address>
    <div style="font-size:13px;color:var(--grey-600);">
      © <span id="jahr"></span> Elektrotechnik Paulus
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var FUNKTION = "https://utmkqpklktbnimnyzmbx.supabase.co/functions/v1/kundenportal";

  document.getElementById("jahr").textContent = new Date().getFullYear();

  var elLaedt   = document.getElementById("laedt");
  var elFehler  = document.getElementById("fehler");
  var elInhalt  = document.getElementById("inhalt");

  // --- kleine Helfer ------------------------------------------------------

  // Baut ein Element und setzt den Text ueber textContent. Bewusst nicht
  // ueber innerHTML: in einem Auftragsnamen koennten spitze Klammern stehen,
  // die der Browser sonst als Befehl liest statt als Text.
  function el(tag, klasse, text) {
    var k = document.createElement(tag);
    if (klasse) k.className = klasse;
    if (text !== undefined && text !== null) k.textContent = text;
    return k;
  }

  function datum(wert) {
    if (!wert) return "–";
    var d = new Date(wert);
    if (isNaN(d.getTime())) return "–";
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
  }

  function datumZeit(wert) {
    if (!wert) return "–";
    var d = new Date(wert);
    if (isNaN(d.getTime())) return "–";
    return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "long", year: "numeric" })
         + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }

  function geld(wert, waehrung) {
    if (wert === null || wert === undefined || wert === "") return "–";
    var z = Number(wert);
    if (isNaN(z)) return "–";
    return z.toLocaleString("de-DE", { style: "currency", currency: waehrung || "EUR" });
  }

  function zeile(bezeichnung, wert) {
    var d = el("div", "zeile");
    d.appendChild(el("dt", null, bezeichnung));
    d.appendChild(el("dd", null, wert));
    return d;
  }

  function karte(ueberschrift) {
    var k = el("section", "karte");
    k.appendChild(el("h2", null, ueberschrift));
    return k;
  }

  function zeigeFehler(text) {
    elLaedt.hidden = true;
    elInhalt.hidden = true;
    document.getElementById("fehler-text").textContent = text;
    elFehler.hidden = false;
  }

  // --- Aufbau der Seite ---------------------------------------------------

  function zeichne(d) {
    document.title = (d.auftragsnummer ? d.auftragsnummer + " · " : "") + "Ihr Auftrag | Elektrotechnik Paulus";

    if (d.anrede) {
      document.getElementById("titel").textContent = "Guten Tag, " + d.anrede;
    }
    var kopfNummer = [];
    if (d.auftragsnummer) kopfNummer.push("Auftrag " + d.auftragsnummer);
    if (d.angelegt_am)    kopfNummer.push("angelegt am " + datum(d.angelegt_am));
    document.getElementById("kopf-nummer").textContent = kopfNummer.join(" · ");

    // Persoenliche Nachricht, falls bei der Freigabe eine hinterlegt wurde.
    if (d.nachricht) {
      elInhalt.appendChild(el("div", "hinweis", d.nachricht));
    }

    // Stand der Arbeiten
    if (d.status) {
      var kStatus = karte("Stand der Arbeiten");
      var balken = el("div", "stufen");
      for (var i = 1; i <= d.status.stufen; i++) {
        balken.appendChild(el("div", "stufe" + (i <= d.status.schritt ? " erreicht" : "")));
      }
      kStatus.appendChild(balken);
      kStatus.appendChild(el("div", "stufe-text", d.status.text));
      kStatus.appendChild(el("div", "stufe-zahl", "Schritt " + d.status.schritt + " von " + d.status.stufen));
      elInhalt.appendChild(kStatus);
    }

    // Angaben zum Auftrag
    if (d.beschreibung || d.adresse || d.projektvolumen !== undefined) {
      var kDaten = karte("Zum Auftrag");
      var liste = el("dl");
      if (d.beschreibung) liste.appendChild(zeile("Leistung", d.beschreibung));
      if (d.adresse)      liste.appendChild(zeile("Einsatzort", d.adresse));
      if (d.projektvolumen !== undefined && d.projektvolumen !== null) {
        liste.appendChild(zeile("Auftragswert", geld(d.projektvolumen, "EUR")));
      }
      kDaten.appendChild(liste);
      elInhalt.appendChild(kDaten);
    }

    // Termine
    if (d.termine && d.termine.length) {
      var kTermine = karte("Termine");
      var dlT = el("dl");
      d.termine.forEach(function (t) {
        var wann = t.ganztaegig ? datum(t.start_zeit) + " (ganztägig)" : datumZeit(t.start_zeit);
        if (t.erledigt) wann += " · erledigt";
        dlT.appendChild(zeile(t.titel, wann));
      });
      kTermine.appendChild(dlT);
      elInhalt.appendChild(kTermine);
    }

    // Dokumente
    if (d.dokumente && d.dokumente.length) {
      var kDok = karte("Ihre Unterlagen");

      var tabelle = el("table");
      var kopf = el("tr");
      ["Nummer", "Art", "Datum"].forEach(function (s) { kopf.appendChild(el("th", null, s)); });
      if (d.zeigt_betraege) {
        kopf.appendChild(el("th", "geld", "Betrag"));
      }
      var thead = el("thead"); thead.appendChild(kopf); tabelle.appendChild(thead);

      var tbody = el("tbody");
      d.dokumente.forEach(function (dok) {
        var tr = el("tr");
        tr.appendChild(el("td", null, dok.nummer || "–"));

        var tdArt = el("td");
        tdArt.appendChild(document.createTextNode((dok.art || "–") + " "));
        if (dok.status === "Storniert") {
          tdArt.appendChild(el("span", "marke-pille storniert", "storniert"));
        }
        tr.appendChild(tdArt);

        tr.appendChild(el("td", null, datum(dok.datum)));
        if (d.zeigt_betraege) {
          tr.appendChild(el("td", "geld", geld(dok.wert, dok.waehrung)));
        }
        tbody.appendChild(tr);
      });
      tabelle.appendChild(tbody);

      var rahmen = el("div", "tabelle-rahmen");
      rahmen.appendChild(tabelle);
      kDok.appendChild(rahmen);
      elInhalt.appendChild(kDok);
    }

    // Rueckfragen
    var kKontakt = karte("Fragen zu diesem Auftrag?");
    var p = el("p", null, "Rufen Sie uns an oder schreiben Sie uns – wir melden uns zurück.");
    p.style.marginBottom = "16px";
    kKontakt.appendChild(p);
    var reihe = el("div", "knopf-reihe");
    reihe.style.justifyContent = "flex-start";
    var aTel = el("a", "btn btn-gelb", "0221 2989 4083");
    aTel.href = "tel:+4922129894083";
    var aMail = el("a", "btn btn-rand", "info@elektrotechnik-paulus.de");
    aMail.href = "mailto:info@elektrotechnik-paulus.de";
    reihe.appendChild(aTel); reihe.appendChild(aMail);
    kKontakt.appendChild(reihe);
    elInhalt.appendChild(kKontakt);

    elLaedt.hidden = true;
    elInhalt.hidden = false;
  }

  // --- Abholen ------------------------------------------------------------

  // Der Token steht als ?code=... in der Adresszeile.
  var code = new URLSearchParams(window.location.search).get("code");

  if (!code) {
    zeigeFehler("In der Adresse fehlt der persönliche Zugangscode. Bitte öffnen Sie den Link noch einmal genau so, wie Sie ihn von uns bekommen haben.");
    return;
  }

  fetch(FUNKTION, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: code })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || d.ok !== true) {
        zeigeFehler(d && d.fehler
          ? d.fehler
          : "Dieser Link ist nicht mehr gültig. Bitte wenden Sie sich an uns.");
        return;
      }
      zeichne(d);
    })
    .catch(function () {
      zeigeFehler("Die Verbindung hat nicht geklappt. Bitte versuchen Sie es in einem Moment noch einmal.");
    });
})();
</script>

</body>
</html>
